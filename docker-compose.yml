services:

  db:
    image: postgres:17
    container_name: forsazh_db

    environment:
      POSTGRES_DB: forsazh
      POSTGRES_USER: forsazh_user
      POSTGRES_PASSWORD: forsazh_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  web:
    build: .
    container_name: forsazh_web

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python seed.py &&
      python manage.py runserver 0.0.0.0:8000
      "

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1

      POSTGRES_DB: forsazh
      POSTGRES_USER: forsazh_user
      POSTGRES_PASSWORD: forsazh_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      - db

    restart: unless-stopped

volumes:
  postgres_data: