{% extends 'base.html' %}

{% block title %}Регистрация во ФОРСАЖ{% endblock %}

{% block content %}

<h2>Регистрация нового клиента</h2>

<form method="post">
    {% csrf_token %}

    <table cellpadding="5">
        {{ form.as_table }}

        <tr>
            <td>Телефон:</td>
            <td>
                <input
                    type="text"
                    name="phone"
                    required
                    placeholder="+375..."
                >
            </td>
        </tr>

        <tr>
            <td>Дата рождения:</td>
            <td>
                <input
                    type="date"
                    name="birth_date"
                    required
                >
            </td>
        </tr>

    </table>

    <button type="submit">
        Зарегистрироваться
    </button>

</form>

{% endblock %}
