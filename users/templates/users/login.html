{% extends 'base.html' %}
{% block title %}Вход во ФОРСАЖ{% endblock %}
{% block content %}
<h2>Вход в личный кабинет</h2>
<form method="post">
    {% csrf_token %}
    <table cellpadding="5">
        {{ form.as_table }}
    </table>
    <button type="submit">Войти</button>
</form>
<p>Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться тут</a></p>
{% endblock %}
